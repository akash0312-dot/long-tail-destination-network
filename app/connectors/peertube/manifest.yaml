key: peertube
version: 1.0.0
name: PeerTube (video import from URL)
tier: native
auth: oauth2   # local OAuth client + password grant -> bearer token
surfaces:
  - key: video
    content_types: [video, video_link]
    spec:
      title_max_chars: 120
      title_min_chars: 3
      title_required: true
      body_max_chars: 9900   # description limit 10000 minus the hidden idempotency marker
      links_allowed: true
      media_types: [video/mp4, video/webm, video/quicktime, image/jpeg, image/png]
      min_video: 1
      max_media: 2
      max_tags: 5
rate_limits:
  per_connection: {requests: 50, per_seconds: 10}
capabilities: [publish, status, delete, refresh_auth, metrics]
error_map:
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url   # destination.params.channel_id picks the channel
