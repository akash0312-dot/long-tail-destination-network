key: mrss
version: 1.0.0
name: MRSS video feed (CTV apps and video aggregators pull it)
tier: feed
auth: none
surfaces:
  - key: feed_item
    content_types: [video]
    spec:
      title_max_chars: 200
      title_required: true
      body_max_chars: 5000
      links_allowed: true
      media_types: [video/mp4, video/quicktime, video/webm, application/x-mpegURL, image/jpeg, image/png]
      min_video: 1
      max_media: 2   # the video, plus an optional thumbnail image
rate_limits:
  per_connection: {requests: 600, per_seconds: 60}
capabilities: [publish, status, delete]
error_map: {}
instance_param: feed_key   # one connector, many feeds: each destination names its feed
