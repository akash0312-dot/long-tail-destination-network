key: hashnode
version: 1.0.0
name: Hashnode (GraphQL API) blog posts
tier: native
auth: api_key   # personal access token in the Authorization header
surfaces:
  - key: article
    content_types: [article, text]
    spec:
      title_max_chars: 250
      title_min_chars: 6
      title_required: true
      links_allowed: true
      media_types: [image/jpeg, image/png, image/gif, image/webp]
      max_media: 1   # cover image
      max_tags: 5
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "422": PLATFORM_CONTENT_REJECTED
  "429": PLATFORM_RATE_LIMIT
instance_param: base_url   # https://gql.hashnode.com; destination.params.publication_id picks the blog
