name: uptime

# Hourly check that the public live demo answers. A failed scheduled run makes GitHub email the repository owner,
# so an outage during the review period is noticed. About 1 Actions minute per run (~750 a month).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

env:
  DEMO_URL: https://16-178-103-126.sslip.io

jobs:
  live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health, readiness, docs and the public MRSS feed answer over HTTPS
        run: |
          for path in /health /ready /docs /api/v1/feeds/creator-video.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 --retry 2 --retry-delay 10 "$DEMO_URL$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
      - name: The API still refuses requests without the token
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$DEMO_URL/api/v1/connectors")
          echo "/api/v1/connectors without a token -> $code"
          [ "$code" = 401 ]
